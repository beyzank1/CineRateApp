version: '3.8'

services:
  # --- 1. The Database (PostgreSQL) ---
  db:
    image: postgres:15
    container_name: movie_app_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moviedb
    volumes:
      # Persist data so it survives when you restart containers
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # The Health Check
    # This specifically asks Postgres: "Are you ready to accept connections?"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- 2. The Backend ---
  backend:
    build: ./backend
    container_name: movie_app_backend
    # Wait for the DB to be "Healthy" (not just started)
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These variables tell Java how to find the database container
      - DB_URL=jdbc:postgresql://db:5432/moviedb
      - DB_USER=user
      - DB_PASS=password
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: